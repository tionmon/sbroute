name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      # dist is embedded; an empty placeholder is enough for static analysis.
      - run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: go test -race -tags with_quic,with_utls ./... -count=1 -timeout=180s
      - run: go vet -tags with_quic,with_utls ./...
      - run: CGO_ENABLED=0 go build -tags with_quic,with_utls -trimpath -ldflags '-s -w' -o bin/sbroute ./cmd/sbroute
      - run: npx playwright install --with-deps chromium --only-shell && npm run test:e2e
        working-directory: web
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags with_quic,with_utls -trimpath -ldflags '-s -w' -o bin/sbroute-linux-arm64 ./cmd/sbroute
