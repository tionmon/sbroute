version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # sing-box pins its sagernet siblings; update them together.
      sagernet:
        patterns: ["github.com/sagernet/*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
