name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: go test -tags with_quic,with_utls ./... -count=1 -timeout=180s
      - name: Build archives
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w -X github.com/tionmon/sbroute/internal/model.Version=${version} -X github.com/tionmon/sbroute/internal/model.Commit=${GITHUB_SHA::12}"
          mkdir -p dist
          for arch in amd64 arm64; do
            name="sbroute_${version}_linux_${arch}"
            mkdir -p "build/${name}"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -tags with_quic,with_utls -trimpath -ldflags "$ldflags" -o "build/${name}/sbroute" ./cmd/sbroute
            cp LICENSE NOTICE README.md "build/${name}/"
            cp -r deploy examples "build/${name}/"
            tar -C build -czf "dist/${name}.tar.gz" "$name"
          done
          # GPL source offer: ship the exact tagged source next to the binaries.
          git archive --format=tar.gz --prefix="sbroute-${version}/" -o "dist/sbroute_${version}_source.tar.gz" HEAD
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "SBRoute $GITHUB_REF_NAME" --generate-notes --verify-tag
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
