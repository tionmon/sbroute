services:
  sbroute:
    build: ..
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - state:/var/lib/sbroute
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  state:
